name: FAANG Internship Scraper

on:
  schedule:
    # Runs automatically every hour (at minute 0)
    - cron: "0 * * * *"
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper Pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python main.py

      - name: Commit and Push Updated Database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs.db
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update database [skip ci]"
            git push
          else
            echo "No changes in database, skipping commit."
          fi
